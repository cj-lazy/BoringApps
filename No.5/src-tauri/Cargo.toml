[package]
name = "desk"
version = "1.0.0"
description = "Desktop icon toggle utility"
authors = ["you"]
edition = "2021"

[lib]
name = "desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Win32 APIs
windows = { version = "0.62", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

# Registry
winreg = "0.55"

# Thread messaging
crossbeam-channel = "0.5.15"
